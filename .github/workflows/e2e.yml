name: E2E tests

# End-to-end tests in real Obsidian (wdio-obsidian-service), on the manifest's minAppVersion and the latest release.
# Follows the service's sample workflow: Xvfb + herbstluftwm for a display, and the Obsidian downloads cached in
# .obsidian-cache, keyed on the versions under test.
on:
  push:
    # Branches only: a version tag runs this suite through releases.yml, which needs it before publishing.
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs, as in releases.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # WebdriverIO runs under Node; bun installs and builds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Type-check the e2e suite
        run: bun run typecheck:e2e

      # wdio.conf.mts prints the resolved Obsidian versions under CI; that line is the cache key.
      - name: Get the Obsidian cache key
        env:
          CI: "true"
        run: |
          node wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          # wdio.conf.mts may have created the cache directory; the restore below must find it absent.
          rm -rf .obsidian-cache

      - name: Cache Obsidian
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      # A virtual display for Obsidian: Xvfb as the server, herbstluftwm as the window manager (some Obsidian features
      # misbehave without one). The screen is wide enough for the draft spec's wide-window check (2400 px).
      - name: Set up a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y xvfb herbstluftwm
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb "$DISPLAY" -screen 0 2560x1440x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: Run the e2e tests
        env:
          # GitHub's runners have 2 cores.
          WDIO_MAX_INSTANCES: 2
        run: bun run test:e2e
