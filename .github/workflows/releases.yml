name: Build obsidian plugin

on:
  push:
    tags:
      # Version tags only. Previously "*", which meant ANY tag — including a
      # throwaway or diagnostic one — would build and publish a release that
      # BRAT users would then be offered as "Latest".
      - "[0-9]+.[0-9]+.[0-9]+*"
  # Manual fallback: gh workflow run releases.yml --ref <tag>
  #
  # NOTE: This trigger is NOT broken, despite what releases 0.7.1-0.9.0 suggested.
  # GitHub silently skips workflow runs for every tag when more than three tags are
  # pushed at once. Those releases were pushed with `git push --follow-tags`, which
  # dragged a backlog of never-pushed annotated tags along with the new one, tripped
  # that limit, and took the release build down with it — with no error anywhere.
  # Push the version tag on its own (`git push origin <tag>`) and this fires normally.
  # Verified by experiment 2026-07-13: 1 tag => runs; 4 tags at once => nothing runs.
  workflow_dispatch:

env:
  PLUGIN_NAME: inkling
  # Beta channel. BRAT 2.x installs the highest version among a repo's releases, GitHub
  # pre-releases included, for everyone tracking "latest" -- so a beta published on the main repo
  # would reach every user. Betas (any tag with a "-", e.g. 0.13.0-beta.1) therefore go ONLY to
  # this release-only repo. Stable releases go to both, so testers roll onto them when a beta ends.
  BETA_REPO: AndrewBroz/obsidian-inkling-beta

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_BETA: ${{ contains(github.ref_name, '-') }}
      # Fine-grained token with Contents read/write on BETA_REPO. Secrets can't be tested in `if:`,
      # so it is exposed as an env var and checked for emptiness.
      BETA_TOKEN: ${{ secrets.BETA_REPO_TOKEN }}
    steps:
      - name: Check the ref is a version tag
        run: |
          # workflow_dispatch can run on a branch, which would publish a release named after it.
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag; run with --ref <tag>"
            exit 1
          fi
          if [ "$IS_BETA" = "true" ] && [ -z "$BETA_TOKEN" ]; then
            echo "::error::Beta tag but no BETA_REPO_TOKEN secret: a beta can only publish to $BETA_REPO"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Stamp the release manifest
        run: |
          # manifest.json on the default branch only ever names a stable version (Obsidian's
          # community updater reads it), so a beta's manifest gets its version here. BRAT compares
          # the version in the manifest attached to the release.
          if [ "$IS_BETA" = "true" ]; then
            jq --arg v "$GITHUB_REF_NAME" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          fi
          ACTUAL=$(jq -r .version manifest.json)
          if [ "$ACTUAL" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json says $ACTUAL but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build plugin
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
      - name: Generate release notes
        run: |
          # A stable release's notes cover everything since the previous STABLE release, not just
          # since its last beta.
          if [ "$IS_BETA" = "true" ]; then EXCLUDE=""; else EXCLUDE="*-*"; fi
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude "$EXCLUDE" "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "$PREV_TAG..${GITHUB_REF_NAME}" > release_notes.md
          else
            git log -n 50 --pretty=format:'- %s' "${GITHUB_REF_NAME}" > release_notes.md
          fi
      - name: Create release
        if: env.IS_BETA != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            main.js
            manifest.json
            styles.css
      - name: Create release in the beta repo
        # Stable releases are mirrored when the token exists; a beta without it failed above.
        if: env.BETA_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.BETA_REPO }}
          token: ${{ secrets.BETA_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.IS_BETA == 'true' }}
          body_path: release_notes.md
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            main.js
            manifest.json
            styles.css
